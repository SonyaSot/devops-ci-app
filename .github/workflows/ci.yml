name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pylint app --score=no

  test:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      IMAGE: ghcr.io/sonyasot/devops-ci-app

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag "$IMAGE:$GITHUB_SHA" .

      - name: Smoke-test container
        shell: bash
        run: |
          set -euo pipefail

          cleanup() {
            docker logs ci-app || true
            docker rm --force ci-app >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker run --detach --name ci-app \
            --publish 127.0.0.1:5000:5000 "$IMAGE:$GITHUB_SHA"

          ready=0
          for attempt in {1..15}; do
            if curl --fail --silent --show-error --max-time 2 \
              http://127.0.0.1:5000/health --output health.json; then
              ready=1
              break
            fi
            sleep 1
          done

          if [ "$ready" -ne 1 ]; then
            echo "::error::/health did not respond"
            exit 1
          fi

          cat health.json
          jq --exit-status '. == {"status":"ok"}' health.json
          docker exec ci-app id
          test "$(docker exec ci-app id -u)" -ne 0

      - name: Tag image as latest
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker tag "$IMAGE:$GITHUB_SHA" "$IMAGE:latest"

      - name: Sign in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Push image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"